<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }

        .main{
            width: 100vw;
        }
        .center{
            width: 80%;
            margin: auto;
        }

        .center h3{
            background-color: gray;
            color: white;
            text-align: center;
            padding: 10px;
            margin: 10px;
        }
        .center input{
            width: 100%;
            padding: 10px;
            margin-bottom:10px ;
            border: none;
            border-bottom: 5px solid gray;
        }
        .center button{
            width: 100%;
            padding: 10px;
            border: none;
            background-color: gray;
            color : white;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="center">
            <h3>Form Events</h3>
            <h4 class="hname">Full Name</h4>
            <h4 class="hemail">Email Address</h4>
            <h4 class="hphone">Phone No.</h4>
            <h4 class="hdegnation">Degination</h4>
            <h4 class="hsalary">Salary</h4>
            <h4 class="hcity">City Name</h4>
            <h4 class="hstate">State Name</h4>
            <form onsubmit="postData(event)">
                <input type="text" id="name" placeholder="full Name" required onfocus="fun1(event)" onblur="fun2(event)" onchange="fun3(event)">
                <input type="email" id="email" placeholder="Email Address" required onfocus="fun1(event)" onblur="fun2(event)" onchange="fun3(event)">
                <input type="number" id="phone" placeholder="Phone Number" required onfocus="fun1(event)" onblur="fun2(event)" onchange="fun3(event)">
                <input type="text" id="degination" placeholder="Degination" required onfocus="fun1(event)" onblur="fun2(event)" onchange="fun3(event)">
                <input type="number" id="salary" placeholder="Salary" required onfocus="fun1(event)" onblur="fun2(event)" onchange="fun3(event)">
                <input type="text" id="city" placeholder="City Name" required onfocus="fun1(event)" onblur="fun2(event)" onchange="fun3(event)">
                <input type="text" id="state" placeholder="State Name" required onfocus="fun1(event)" onblur="fun2(event)" onchange="fun3(event)">
                <button type="submit"> Submit</button>
            </form>
            
        </div>
    </div>
    <script>
        function fun1(event){
            event.target.style.borderBottom = "5px solid green"
        }
        function fun2(event){
            event.target.style.borderBottom = "5px solid gray"
        }
        function fun3(event){
            let input = document.getElementById(event.target.id)
            let heading = document.getElementById(`h &{input.id}`)
            heading.innerHTML = `${input.placeholder} : ${input.value}`

            function postData(event){
                event.preventDefault()
                alert(`
                Name : ${document.getElementById("name",value)}
                Email : ${document.getElementById("email",value)}
                Phone: ${document.getElementById("phone",value)}
                Degination : ${document.getElementById("degination",value)}
                Salary : ${document.getElementById("salary",value)}
                City : ${document.getElementById("city",value)}
                State : ${document.getElementById("state",value)}
                `)
            }
        }

    </script>
</body>
</html>
