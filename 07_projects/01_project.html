<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
       * {
            margin: 0;
        }
        .main{
            width: 100vw;
            height: 100vh;

             display: flex;
            justify-content: center;
            align-items: center; 
        }
        .center{
            width: 80%;
            height: 80%; 

              position: relative;  
        }
        .images {
            width: 100%;
            height: 100%;
        }
        .images img{
            width: 100%;
            height: 100%;

             display: none;  
        }
         .images img:first-child{  
             display: block; 
          } 
        .btn button{
            position: absolute;
            top: 45%;
            background: none;
            border: none;
        }
        #btnleft{
            left: 30px;
        }
        #btnright{
            right: 30px;
        }
        .icon{
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
    </style> 
</head>
<body>
    <div class="main">
        <div class="center">
            <div class="images" onmouseenter="playPause('pause')" onmouseleave="playPause('play')">
                <img src="image1.jpeg" alt="">
                <img src="image2.avif" alt="">
                <img src="image3.jpg" alt="">
                <img src="image4.jpg" alt="">
                <img src="image5.jpg" alt="">
                <img src="image6.webp" alt="">
                <img src="image7.jpg" alt="">
                <img src="image8.webp" alt="">
                <img src="image9.jpg" alt="">
                <img src="image10.png" alt="">  
            </div>
            <div class="btn">
                <button id="btnleft" onclick="prev()" ">
                    <span class="material-symbols-outlined icon" style="font-size: 25px;">arrow_back_ios</span>
                </button> 
                <button id="btnright" onclick="next()">
                    <span class="material-symbols-outlined icon">chevron_right</span>
                </button>
                
            </div>
        </div>
    </div>

     <script>
        var images = document.querySelectorAll(".images img")
        var index = 0;

        function next() {
            images[index].style.display = "none"
        
             if(index < images.length -1) 
             index++
        else
        index = 0
     images[index].style.display = "block"
        }

         function prev() {
             images[index].style.display = "none"
             if(index === 0)
             index = index.length - 1
         else
     index--
             images[index].style.display = "block"
         }

         let time = setInterval(next,2000)

         function playPause(option) {
             if(option === "pause")
             clearInterval(time)
         else
         time = setInterval(next,2000)
         }
     </script> 
     </body>
</html>
